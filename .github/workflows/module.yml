name: build module

on:
  push:
    branches: master
    paths-ignore: 
      - '**.md'
  workflow_dispatch:

env:
  MODULE_NAME: 'ksu_toolkit'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup zig
        uses: mlugg/setup-zig@v2
        with:
          version: master

      - name: Install sstrip
        run: sudo apt install -y elfkickers

      - name: compile via zigcc
        run: |
          cd src
          make all

          mkdir -p ../module/bin          
          mv out/toolkit-* ../module/bin

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 'latest'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: Build WebUI
        run: |
          cd webui
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Update version code
        run: sed -i 's/^versionCode=.*/versionCode=${{ github.run_number }}/' module/module.prop

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.MODULE_NAME }}-${{ github.run_number }}
          path: module/
